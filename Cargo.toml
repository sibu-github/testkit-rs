[package]
name = "testkit-rs"
version = "0.1.0"
edition = "2024"
authors = ["Sibaprasad Maiti <sibu.it13@gmail.com>"]
description = "Lightweight, in-process service fakes for unit testing Rust applications with real client libraries."
license = "MIT"
repository = "https://github.com/sibu-github/testkit-rs"
homepage = "https://github.com/sibu-github/testkit-rs"
documentation = "https://docs.rs/testkit-rs"
readme = "README.md"
keywords = ["unit-testing", "mocking", "mongodb", "postgres", "http"]
categories = ["development-tools::testing", "database"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
mongo = ["dep:mongodb", "dep:bson", "dep:futures", "dep:serde"]
postgres = ["dep:sqlx", "dep:regex"]
http = [
        "dep:reqwest",
        "dep:hyper",
        "dep:hyper-util",
        "dep:http-body-util",
        "dep:url",
        "dep:rcgen",
        "dep:tokio-rustls",
        "dep:serde",
        "dep:serde_json"
    ]
ssm = [
        "dep:aws-config",
        "dep:aws-sdk-ssm",
        "dep:hyper",
        "dep:hyper-util",
        "dep:http-body-util",
        "dep:serde_json"
    ]
vault = [
        "dep:vaultrs",
        "dep:hyper",
        "dep:hyper-util",
        "dep:http-body-util",
        "dep:serde",
        "dep:serde_json"
    ]
s3 = [
        "dep:aws-config",
        "dep:aws-sdk-s3",
        "dep:hyper",
        "dep:hyper-util",
        "dep:http-body-util",
        "dep:url",
        "dep:serde_json"
    ]

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.12.0", optional = true }
aws-sdk-s3 = { version = "1.152.0", optional = true, features = ["behavior-version-latest"] }
aws-sdk-ssm = { version = "1.128.0", optional = true }
bson = { version = "3.1.0", features = ["serde"], optional = true }
futures = { version = "0.3.34", optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.12.0", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", optional = true, features = ["tokio"] }
mongodb = { version = "3.9.1", features = ["bson-3"], optional = true }
rcgen = { version = "0.14.10", optional = true }
reqwest = { version = "0.13.5", optional = true, features = ["query", "json"] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util"]}
tokio-rustls = { version = "0.26.6", optional = true }
url = { version = "2.5.8", optional = true }
vaultrs = { version = "0.8.0", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
regex = { version = "1.13.1", optional = true }
