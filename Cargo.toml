[package]
name = "testkit-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
mongo = ["dep:tokio", "dep:mongodb", "dep:bson", "dep:futures", "dep:serde"]


[dependencies]
anyhow = "1.0.104"
bson = { version = "3.1.0", features = ["serde"], optional = true }
futures = { version = "0.3.34", optional = true }
mongodb = { version = "3.9.1", features = ["bson-3"], optional = true }
serde = { version = "1.0.229", optional = true }
tokio = { version = "1.53.2", optional = true }
